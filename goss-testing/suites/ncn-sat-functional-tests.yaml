#
# This is a suite of functional tests for validating the functionality of the
# System Admin Toolkit (SAT). Tests are written as Python unittests in the
# csm_testing.tests.sat_functional package. This Goss suite just includes the
# goss-sat-functional-tests.yaml Goss file, which dynamically creates a Goss
# "command" test for each unittest.TestCase in the sat_functional package.
#
# Most `sat` commands are just making requests to the CSM APIs, so these tests
# can be run on any ncn-m node in the system. Running on a single node is handled
# by the tests/functional/sat_functional_tests.sh script in the hpc-dst-goss-testing
# repository for the DST CT pipeline.

gossfile:
  ../tests/goss-sat-functional-tests.yaml: {}
