{{ $pre_checks := .Vars.iuf_pre_checks }}
{{ $activity := .Vars.iuf_activity }}
{{ $scripts := .Env.GOSS_BASE | printf "%s/scripts" }}
{{ $media_dir := .Env.GOSS_BASE | printf "%s/scripts/iuf_run_setup" }}
{{ $logrun := .Env.GOSS_BASE | printf "%s/scripts/log_run.sh" }}
{{ $iuf_pre_checks := $scripts | printf "%s/python/iuf_pre_checks" }}
{{ $iuf_run := $scripts | printf "%s/python/iuf_run" }}
{{ $iuf_cleanup := $scripts | printf "%s/python/iuf_cleanup" }}
command:
  {{ $testlabel := "iuf_activity_stages" }}
  {{$testlabel}}:
    title: iuf activity stages
    meta:
      desc: Gives List of stages executed for a particular IUF activity.
      sev: 0
    exec: |-
      "{{$logrun}}" -l "{{$testlabel}}" bash -c '
          # Run pre-checks for IUF
          "{{$iuf_pre_checks}}" "{{ index $pre_checks 0 }}" "{{ index $pre_checks 1 }}" "{{ index $pre_checks 2 }}" "{{ index $pre_checks 3 }}" "{{ index $pre_checks 4 }}" "{{ index $pre_checks 5 }}" && \

          # Run IUF activity
          "{{$iuf_run}}" "{{$media_dir}}" "{{ index $activity 0 }}" && \

          # Running the test case
          /usr/bin/iuf -a "{{ index $activity 0 }}" ls
          
          # Capture the exit code of the previous step
          run_exit_code=$?

          # Run cleanup step independently
          "{{$iuf_cleanup}}" "{{ index $activity 0 }}"

          # Exit with non-zero exit code if the iuf ls command failed with non-zero exit code
          if [ $run_exit_code -ne 0 ]; then
            exit $run_exit_code
          fi
        '
    exit-status: 0
    timeout: 180000
    skip: false