{{ $scripts := .Env.GOSS_BASE | printf "%s/scripts" }}
{{ $logrun := .Env.GOSS_BASE | printf "%s/scripts/log_run.sh" }}

command:
  {{ $testlabel := "rr_deployment_check" }}
  {{$testlabel}}:
    title: RR deployment and pod health check
    meta:
      desc: Verifies that the cray-rrs deployment exists and pods are running. Prerequisites (zones, helm, configmaps) are validated by earlier gates.
      sev: 0
    exec: |-
      "{{$logrun}}" -l "{{$testlabel}}" bash -c '
        set -euo pipefail
        # Check if Rack Resiliency is enabled
        if [ ! -f /tmp/rr_enabled_marker ]; then
          echo "SKIPPED: Rack Resiliency is not enabled on this system"
          exit 0
        fi
        
        # Check if cray-rrs deployment exists
        echo "Checking cray-rrs deployment status..."
        DEPLOYMENT_EXISTS=$(kubectl get deployment cray-rrs -n rack-resiliency -o jsonpath="{.metadata.name}" 2>/dev/null || echo "NotFound")
        
        if [ "$DEPLOYMENT_EXISTS" == "NotFound" ]; then
          echo "FAILURE: cray-rrs deployment not found in rack-resiliency namespace"
          exit 1
        fi
        
        echo "cray-rrs deployment: Found"
        
        # Check pod status - should be Running since all prerequisites passed
        POD_STATUS=$(kubectl get pods -n rack-resiliency -l app.kubernetes.io/instance=cray-rrs -o jsonpath="{.items[0].status.phase}" 2>/dev/null || echo "NotFound")
        echo "Pod status: $POD_STATUS"
        
        if [ "$POD_STATUS" == "Running" ]; then
          echo "SUCCESS: Deployment pods are Running"
          exit 0
        else
          echo "FAILURE: Pod is in $POD_STATUS state. NOTE: If any of the prerequisites tests were skipped, the cray-rrs pod will not be Running."
          exit 1
        fi
      '
    exit-status: 0
    timeout: 60000
    skip: false
