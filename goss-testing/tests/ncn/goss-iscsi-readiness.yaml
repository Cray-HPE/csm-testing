{{ $env_hostname := getEnv "HOSTNAME" }}
{{ $vars_hostname := get .Vars "this_node_name" }}
{{ $this_node_name := default $env_hostname $vars_hostname }}
{{ $readiness := .Vars.iscsi_readiness }}
{{ $scripts := .Env.GOSS_BASE | printf "%s/scripts" }}
{{ $logrun := .Env.GOSS_BASE | printf "%s/scripts/log_run.sh" }}
{{ $iscsi_readiness := $scripts | printf "%s/python/iscsi_sbps_readiness_test" }}

command:
  {{if eq $this_node_name "ncn-m001"}}
    {{ $testlabel := "iSCSI-readiness-test" }}
    {{$testlabel}}:
      title: iSCSI-readinesss-test
      meta:
        desc: Readiness Test for iSCSI.
        sev: 0
      exec: |-
        "{{$logrun}}" -l "{{$testlabel}}" bash -c '
          # Run Readiness Test for iSCSI
          "{{$iscsi_readiness}}" "{{ index $readiness 0 }}" "{{ index $readiness 1 }}" "{{ index $readiness 2 }}" "{{ index $readiness 3 }}"
        '
      exit-status: 0
      timeout: 600000
      skip: false
