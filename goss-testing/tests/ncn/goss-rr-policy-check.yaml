{{ $scripts := .Env.GOSS_BASE | printf "%s/scripts" }}
{{ $logrun := .Env.GOSS_BASE | printf "%s/scripts/log_run.sh" }}

command:
  {{ $testlabel := "rr_policy_check" }}
  {{$testlabel}}:
    title: RR Cluster Policy Check
    meta:
      desc: Verifies that the insert-labels-topology-constraints ClusterPolicy exists for Rack Resiliency.
      sev: 0
    exec: |-
      "{{$logrun}}" -l "{{$testlabel}}" bash -c '
        set -euo pipefail
        # Check if Rack Resiliency is enabled
        if [ ! -f /tmp/rr_enabled_marker ]; then
          echo "SKIPPED: Rack Resiliency is not enabled on this system"
          exit 0
        fi
        
        # Check if the ClusterPolicy exists
        echo "Checking for insert-labels-topology-constraints ClusterPolicy..."
        POLICY_EXISTS=$(kubectl get clusterpolicy insert-labels-topology-constraints -o jsonpath="{.metadata.name}" 2>/dev/null || echo "NotFound")
        
        if [ "$POLICY_EXISTS" == "NotFound" ]; then
          echo "FAILURE: insert-labels-topology-constraints ClusterPolicy not found"
          exit 1
        fi
        
        echo "ClusterPolicy found: $POLICY_EXISTS"
        
        # Get policy details
        kubectl get clusterpolicy insert-labels-topology-constraints -o yaml
        
        echo "SUCCESS: insert-labels-topology-constraints ClusterPolicy exists"
        exit 0
      '
    exit-status: 0
    timeout: 600
    skip: false
