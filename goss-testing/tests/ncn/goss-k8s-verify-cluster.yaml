{{ $kubectl := .Vars.kubectl }}
{{ $logrun := .Env.GOSS_BASE | printf "%s/scripts/log_run.sh" }}
{{ $verify_kube_system_pods := .Env.GOSS_BASE | printf "%s/scripts/verify_kube_system_pods.sh" }}
command:
    {{ $testlabel_1 := "k8s_verify_cluster_1" }}
    {{$testlabel_1}}:
        title: Specific kube-system Pods Running
        meta:
            desc: Specific Kubernetes kube-system namespace pods are Running.
            sev: 0
        exec: |-
            "{{$logrun}}" -l "{{$testlabel_1}}" \
                "{{$kubectl}}" get po -n kube-system -o custom-columns=:.metadata.name,:status.phase --no-headers
        stderr:
            # Fail if any line of stderr contains any characters -- that is, fail if there is any output to stderr
            - "!/./"
        stdout:
            - /^coredns-.*Running/
            - /^kube-apiserver-.*Running/
            - /^kube-controller-manager-.*Running/
            - /^kube-multus-ds-.*Running/
            - /^kube-proxy-.*Running/
            - /^kube-scheduler-.*Running/
            - /^weave-net-.*Running/
        exit-status: 0
        timeout: 20000
    {{ $testlabel_2 := "k8s_verify_cluster_2" }}
    {{$testlabel_2}}:
        title: All kube-system Pods Running or Completed
        meta:
            desc: All Kubernetes kube-system namespace pods are Running or Completed.
            sev: 0
        # Look for pods that are not Running or Completed
        # However, we do allow etcdbackup job pods to be in other "normal" lifecycle states
        exec: |-
            "{{$logrun}}" -l "{{$testlabel_2}}" "{{$verify_kube_system_pods}}"
        # We expect no output when all pods are in a good state
        # or if a failed pod has a newer one that succeeded
        stdout:
            - "!/./"
        stderr:
            - "!/./"
        # the script should return 0 as it checks all pods and the errors will be checked via the stdout/stderr
        exit-status: 0
        timeout: 20000
