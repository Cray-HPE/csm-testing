{{ $scripts := .Env.GOSS_BASE | printf "%s/scripts" }}
{{ $logrun := .Env.GOSS_BASE | printf "%s/scripts/log_run.sh" }}

command:
  {{ $testlabel := "rrs_configmap_check" }}
  {{$testlabel}}:
    title: RRS ConfigMap validation
    meta:
      desc: Verifies that the required RRS ConfigMaps (rrs-mon-static and rrs-mon-dynamic) exist in the rack-resiliency namespace.
      sev: 0
    exec: |-
      "{{$logrun}}" -l "{{$testlabel}}" bash -c '
        # Check if rrs-mon-static ConfigMap exists
        echo "Checking rrs-mon-static ConfigMap..." && \
        kubectl get configmap rrs-mon-static -n rack-resiliency -o jsonpath="{.metadata.name}" && \
        echo "" && \
        
        # Check if rrs-mon-dynamic ConfigMap exists
        echo "Checking rrs-mon-dynamic ConfigMap..." && \
        kubectl get configmap rrs-mon-dynamic -n rack-resiliency -o jsonpath="{.metadata.name}" && \
        echo "" && \
        
        # Validate rrs-mon-static contains critical services configuration
        echo "Validating critical services configuration in rrs-mon-static..." && \
        kubectl get configmap rrs-mon-static -n rack-resiliency -o jsonpath="{.data.critical-service-config\.json}" | jq -e ".critical_services" > /dev/null
      '
    exit-status: 0
    timeout: 60000
    skip: false
