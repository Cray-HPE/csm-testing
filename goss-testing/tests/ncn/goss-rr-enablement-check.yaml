{{ $scripts := .Env.GOSS_BASE | printf "%s/scripts" }}
{{ $logrun := .Env.GOSS_BASE | printf "%s/scripts/log_run.sh" }}

command:
  {{ $testlabel := "rack_resiliency_enablement_check" }}
  {{$testlabel}}:
    title: Rack Resiliency Enablement Check
    meta:
      desc: Verifies that Rack Resiliency is enabled in the system by checking the customizations.yaml configuration.
      sev: 0
    exec: |-
      "{{$logrun}}" -l "{{$testlabel}}" bash -c '
        set -euo pipefail
        # Get customizations.yaml from the site-init secret
        echo "Retrieving customizations.yaml from site-init secret..." && \
        CUSTOMIZATIONS=$(kubectl get secrets -n loftsman site-init -o jsonpath="{.data.customizations\.yaml}" | base64 -d) && \
        
        # Check if rack-resiliency is enabled
        echo "Checking if Rack Resiliency is enabled..." && \
        RR_ENABLED=$(echo "$CUSTOMIZATIONS" | yq r - "spec.kubernetes.services.rack-resiliency.enabled") && \
        
        echo "Rack Resiliency enabled status: $RR_ENABLED" && \
        
        # Create marker file for conditional test execution
        if [ "$RR_ENABLED" = "true" ]; then
          echo "SUCCESS: Rack Resiliency is enabled"
          touch /tmp/rr_enabled_marker
          exit 0
        else
          echo "INFO: Rack Resiliency is not enabled"
          rm -f /tmp/rr_enabled_marker
          exit 0
        fi
      '
    exit-status: 0
    timeout: 60000
    skip: false

  {{ $testlabel_negative := "rack_resiliency_disabled_deployment_check" }}
  {{$testlabel_negative}}:
    title: Deployment State Check When RR Disabled (Negative Test)
    meta:
      desc: When RR is disabled, verifies that deployment is in Pending or NotFound state.
      sev: 0
    exec: |-
      "{{$logrun}}" -l "{{$testlabel_negative}}" bash -c '
        set -euo pipefail
        # Check if RR is enabled via marker file
        if [ -f /tmp/rr_enabled_marker ]; then
          echo "SKIPPED: RR is enabled, negative test not applicable"
          exit 0
        fi
        
        echo "RR is disabled - checking deployment state..."
        
        # Check if deployment exists
        DEPLOYMENT=$(kubectl get deployment cray-rrs -n rack-resiliency -o jsonpath="{.metadata.name}" 2>/dev/null || echo "NotFound")
        
        if [ "$DEPLOYMENT" = "NotFound" ]; then
          echo "SUCCESS: Deployment not found (expected when RR disabled)"
          exit 0
        fi
        
        echo "Deployment exists, checking pod status..."
        POD_STATUS=$(kubectl get pods -n rack-resiliency -l app.kubernetes.io/instance=cray-rrs -o jsonpath="{.items[0].status.phase}" 2>/dev/null || echo "NotFound")
        echo "Pod status: $POD_STATUS"
        
        if [ "$POD_STATUS" = "NotFound" ] || [ "$POD_STATUS" = "Pending" ]; then
          echo "SUCCESS: Deployment is in expected state when RR disabled (status: $POD_STATUS)"
          exit 0
        else
          echo "FAILURE: When RR is disabled, deployment should be Pending or NotFound, but found: $POD_STATUS"
          exit 1
        fi
      '
    exit-status: 0
    timeout: 60000
    skip: false
