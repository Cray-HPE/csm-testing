{{ $env_hostname := getEnv "HOSTNAME" }}
{{ $vars_hostname := get .Vars "this_node_name" }}
{{ $this_node_name := default $env_hostname $vars_hostname }}
{{ $pre_checks := .Vars.iscsi_prechecks }}
{{ $iscsi_uan_reboot := .Vars.iscsi_uan_reboot }}
{{ $scripts := .Env.GOSS_BASE | printf "%s/scripts" }}
{{ $logrun := .Env.GOSS_BASE | printf "%s/scripts/log_run.sh" }}
{{ $iscsi_node_reboot := $scripts | printf "%s/python/iscsi_node_reboot" }}
{{ $iscsi_pre_checks := $scripts | printf "%s/python/iscsi_prechecks" }}

command:
  {{if eq $this_node_name "ncn-m001"}}
    {{ $testlabel := "iSCSI-uan-reboot" }}
    {{$testlabel}}:
      title: iSCSI-uan-reboot
      meta:
        desc:  Rebooting UAN node with iSCSI.
        sev: 0
      exec: |-
        "{{$logrun}}" -l "{{$testlabel}}" bash -c '
          # Run pre-checks for iSCSI
        "{{$iscsi_pre_checks}}" "{{ index $pre_checks 0 }}" "{{ index $pre_checks 1 }}" "{{ index $pre_checks 2 }}" "{{ index $pre_checks 3 }}" "{{ index $pre_checks 4 }}" "{{ index $pre_checks 5 }}" && \

          # Run UAN node reboot
        "{{ $iscsi_node_reboot }}" "uan" "{{ $iscsi_uan_reboot.interface }}" "{{ $iscsi_uan_reboot.image_path }}" "{{ $iscsi_uan_reboot.image_etag }}" "{{ $iscsi_uan_reboot.cfs_configuration }}" "{{ $scripts }}"
        '
      exit-status: 0
      timeout: 3000000
      skip: false
   {{end}}
