{{ $scripts := .Env.GOSS_BASE | printf "%s/scripts" }}
{{ $logrun := .Env.GOSS_BASE | printf "%s/scripts/log_run.sh" }}

command:
  {{ $testlabel := "rr_services_balance_check" }}
  {{$testlabel}}:
    title: RR Services Balance Check
    meta:
      desc: Verifies that all critical services are balanced across zones.
      sev: 0
    exec: |-
      "{{$logrun}}" -l "{{$testlabel}}" bash -c '
        set -euo pipefail
        # Check if Rack Resiliency is enabled
        if [ ! -f /tmp/rr_enabled_marker ]; then
          echo "SKIPPED: Rack Resiliency is not enabled on this system"
          exit 0
        fi
        
        # Check if deployment is Running (prerequisite for CLI commands)
        POD_STATUS=$(kubectl get pods -n rack-resiliency -l app.kubernetes.io/instance=cray-rrs -o jsonpath="{.items[0].status.phase}" 2>/dev/null || echo "NotFound")
        if [ "$POD_STATUS" != "Running" ]; then
          echo "SKIPPED: Deployment not Running (status: $POD_STATUS), cannot test CLI"
          exit 0
        fi
        
        echo "Checking if all critical services are balanced across zones..."
        
        # Get the critical services status list
        STATUS_OUTPUT=$(cray rr criticalservices status list --format json 2>/dev/null)
        
        if [ -z "$STATUS_OUTPUT" ]; then
          echo "FAILURE: Unable to retrieve critical services status"
          exit 1
        fi
        
        echo "Critical Services Status:"
        echo "$STATUS_OUTPUT" | jq "."
        
        # Check if all services are balanced
        UNBALANCED_SERVICES=$(echo "$STATUS_OUTPUT" | jq -r ".critical_services_status.namespace | to_entries[] | .value[] | select(.balanced == false) | .name" 2>/dev/null || echo "")
        
        if [ -z "$UNBALANCED_SERVICES" ]; then
          echo "SUCCESS: All critical services are balanced across zones"
          exit 0
        else
          echo "WARNING: The following services are not balanced:"
          echo "$UNBALANCED_SERVICES"
          echo ""
          echo "This may be expected during system initialization or maintenance."
          echo "Check individual service status with: cray rr criticalservices status describe <service-name>"
          exit 0
        fi
      '
    exit-status: 0
    timeout: 60000
    skip: false
