{{ $scripts := .Env.GOSS_BASE | printf "%s/scripts" }}
{{ $logrun := .Env.GOSS_BASE | printf "%s/scripts/log_run.sh" }}

command:
  {{ $testlabel := "rr_zones_describe" }}
  {{$testlabel}}:
    title: RR zones describe
    meta:
      desc: Verifies the endpoint functionality for the cray rrs zones describe command.
      sev: 0
    exec: |-
      "{{$logrun}}" -l "{{$testlabel}}" bash -c '
        set -euo pipefail
        # Check if Rack Resiliency is enabled
        if [ ! -f /tmp/rr_enabled_marker ]; then
          echo "SKIPPED: Rack Resiliency is not enabled on this system"
          exit 0
        fi
        
        # Check if deployment is Running (prerequisite for CLI commands)
        POD_STATUS=$(kubectl get pods -n rack-resiliency -l app.kubernetes.io/instance=cray-rrs -o jsonpath="{.items[0].status.phase}" 2>/dev/null || echo "NotFound")
        if [ "$POD_STATUS" != "Running" ]; then
          echo "SKIPPED: Deployment not Running (status: $POD_STATUS), cannot test CLI"
          exit 0
        fi
        
        # Get the first zone name dynamically
        ZONE_NAME=$(cray rrs zones list --format json | jq -r ".Zones[0].Zone_Name // empty")
        if [ -z "$ZONE_NAME" ]; then
          echo "No zones found in the system"
          exit 1
        fi

        # Run RR zones describe command
        cray rrs zones describe "$ZONE_NAME" --format json > /dev/null && \
        echo "Endpoint is working: cray rrs zones describe command executed successfully."
      '
    exit-status: 0
    timeout: 600
    skip: false
