{{ $scripts := .Env.GOSS_BASE | printf "%s/scripts" }}
{{ $logrun := .Env.GOSS_BASE | printf "%s/scripts/log_run.sh" }}

command:
  {{ $testlabel := "rr_k8s_zones_check" }}
  {{$testlabel}}:
    title: RR Kubernetes zones check
    meta:
      desc: Verifies that Kubernetes topology zones are configured by checking node labels for topology.kubernetes.io/zone.
      sev: 0
    exec: |-
      "{{$logrun}}" -l "{{$testlabel}}" bash -c '
        set -euo pipefail
        # Check if Rack Resiliency is enabled
        if [ ! -f /tmp/rr_enabled_marker ]; then
          echo "SKIPPED: Rack Resiliency is not enabled on this system"
          exit 0
        fi
        
        # Check Kubernetes topology zones using node labels
        echo "Checking Kubernetes topology zones..."
        kubectl get nodes -L topology.kubernetes.io/zone
        
        # Get total node count
        TOTAL_NODES=$(kubectl get nodes --no-headers | wc -l)
        echo "Total nodes: $TOTAL_NODES"
        
        # Count nodes with zone labels
        ZONE_COUNT=$(kubectl get nodes -L topology.kubernetes.io/zone --no-headers | awk "{print \$6}" | grep -v "^$" | wc -l)
        echo "Nodes with zone labels: $ZONE_COUNT"
        
        # Check if any zones are configured
        if [ "$ZONE_COUNT" -eq 0 ]; then
          echo "FAILURE: No Kubernetes zones found"
          exit 1
        fi
        
        # Check if all nodes have zone labels
        if [ "$ZONE_COUNT" -eq "$TOTAL_NODES" ]; then
          echo "SUCCESS: All nodes have zone labels configured"
          exit 0
        else
          MISSING_COUNT=$((TOTAL_NODES - ZONE_COUNT))
          echo "FAILURE: $MISSING_COUNT node(s) missing zone labels"
          kubectl get nodes -L topology.kubernetes.io/zone --no-headers | awk "{print \$1, \$6}" | grep " $" || true
          exit 1
        fi
      '
    exit-status: 0
    timeout: 600
    skip: false
