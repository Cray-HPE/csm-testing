[project]
name = 'csm-testing'
authors = [
    { name = 'Hewlett Packard Enterprise Development LP' },
]
classifiers = [
    'License :: OSI Approved :: MIT License',
    'Natural Language :: English',
    'Operating System :: POSIX',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: 3.6',
]
description = 'CSM testing Python tests and tools'
# dependencies are handled in requirements.txt
# Since this package is not being published, there is no harm in separating
# the requirements from the package itself
maintainers = [
    { name = 'Bo Quan', email = 'bo.quan@hpe.com'},
    { name = 'Jacob Salmela', email = 'jacob.salmela@hpe.com'},
    { name = 'Mitch Harding', email = 'mitchell.harding@hpe.com'}
]
# The tests and tools have only ever been used with Python 3.6. They may work with newer
# versions, but this should be verified before assuming that.
requires-python = '>=3.6,<3.7'
# The actual version is filled in at build time, but has little meaning, since this
# package is not published and is only installed inside the csm-testing virtual environment
version = '0.0.57'

# This stanza is filled in dynamically at build time
[project.scripts]

[metadata]
url = 'https://github.com/Cray-HPE/csm-testing'

license = { file = 'LICENSE' }

[tool.setuptools]
package-dir = {"" = "src"}

[build-system]
build-backend = 'setuptools.build_meta'
requires = [
    'setuptools',
    'wheel',
]

[tool.distutils.bdist_wheel]
universal = false # This app is not compatible with Python2.
