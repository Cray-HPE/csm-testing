---
configurations:
# A simple configuration that has just one layer that runs a simple playbook
- name: "{{test.config_name}}"
  layers:
  - name: successful-layer
    playbook: test.yml
    git:
      url: "https://api-gw-service-nmn.local/vcs/cray/{{test.vcs_repo_name}}.git"
      branch: "main"

images:
# An image configured from the CSM barebones image
- name: "{{test.image_name}}"
  base:
    product:
      name: csm
      version: "{{csm.version}}"
      type: image
      filter:
        arch: x86_64
        wildcard: "*barebones*"
  configuration: "{{test.config_name}}"
  configuration_group_names:
  - Compute

session_templates:
# A session template that references an existing IMS image and the simple configuration
- name: "{{test.session_template_name}}"
  image:
    ims:
      id: "{{csm.image_id}}"
  configuration: "{{test.config_name}}"
  bos_parameters:
    boot_sets:
      compute:
        arch: X86
        kernel_parameters: "spire_join_token=${SPIRE_JOIN_TOKEN}"
        node_roles_groups:
        - Compute
        rootfs_provider: "sbps"
        rootfs_provider_passthrough: "sbps:v1:iqn.2023-06.csm.iscsi:_sbps-hsn._tcp.{{default.system_name}}.{{default.site_domain}}:300"
