---
# Define a configuration to use in image customization
configurations:

# A simple configuration that has just one layer that runs a simple failing playbook
- name: "{{test.prefix}}-simple-failing-configuration"
  layers:
  - name: failing-layer
    playbook: test-fail.yml
    git:
      url: "https://api-gw-service-nmn.local/vcs/cray/{{test.vcs_repo_name}}.git"
      branch: "main"

images:
- name: "{{test.prefix}}-simple-customized-image"
  base:
    product:
      name: csm
      version: "{{csm.version}}"
      type: image
      filter:
        arch: x86_64
        wildcard: "*barebones*"
  configuration: "{{test.prefix}}-simple-failing-configuration"
  configuration_group_names:
  - Compute

