---
configurations:
# A simple configuration used by the session template
- name: "{{test.prefix}}-simple-passing-configuration"
  if_exists: "skip"
  layers:
  - name: successful-layer
    playbook: test.yml
    git:
      url: "https://api-gw-service-nmn.local/vcs/cray/{{test.vcs_repo_name}}.git"
      branch: "main"

session_templates:
# A session template with if_exists set to "skip"
- name: "{{test.session_template_name}}-skip"
  if_exists: "skip"
  image:
    ims:
      id: "{{csm.image_id}}"
  configuration: "{{test.prefix}}-simple-passing-configuration"
  bos_parameters:
    boot_sets:
      compute:
        arch: X86
        kernel_parameters: "spire_join_token=${SPIRE_JOIN_TOKEN}"
        node_roles_groups:
        - Compute
        rootfs_provider: "sbps"
        rootfs_provider_passthrough: "sbps:v1:iqn.2023-06.csm.iscsi:_sbps-hsn._tcp.{{default.system_name}}.{{default.site_domain}}:300"

# A session template with if_exists set to "overwrite"
- name: "{{test.session_template_name}}-overwrite"
  if_exists: "overwrite"
  image:
    ims:
      id: "{{csm.image_id}}"
  configuration: "{{test.prefix}}-simple-passing-configuration"
  bos_parameters:
    boot_sets:
      compute:
        arch: X86
        kernel_parameters: "spire_join_token=${SPIRE_JOIN_TOKEN}"
        node_roles_groups:
        - Compute
        rootfs_provider: "sbps"
        rootfs_provider_passthrough: "sbps:v1:iqn.2023-06.csm.iscsi:_sbps-hsn._tcp.{{default.system_name}}.{{default.site_domain}}:300"
